name: Update Documentation on Yuque

on:
  pull_request:
    types: [closed]
    branches:
      - main
    # paths:
    #   - "**/*.zh.md"

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install node-fetch

      - name: Create test directory
        run: mkdir -p site/docs

      - name: Create test file
        run: echo "# 测试文档" > site/docs/test.zh.md

      - name: Run Yuque update script
        uses: actions/github-script@v7.0.1
        with:
          token: ${{ secrets.YUQUE_GROUP_TOKEN }}
          script: |
            const script = require('./.github/workflows/scripts/updateYuque.js');
            await script({
              core, 
              inputs: {
                token: '${{ secrets.YUQUE_GROUP_TOKEN }}'
              }
            });
