name: Auto Close Issue
on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Warn Inactive Issue
        if: ${{ github.event.label.name == 'stale' }}
        uses: actions-cool/issues-helper@v3
        with:
          actions: "create-comment"
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⚠️ This issue has been automatically closed due to inactivity. 

            - If the issue is still relevant and important to you, feel free to:
              1. Reopen with additional information
              2. Create a new issue with updated context
              3. Reference any related issues or discussions

            We close inactive issues to keep our backlog manageable and focused on active issues.

            Your contribution makes our project better! 🌟

            ---

            ⚠️ 由于长期无活动，此 issue 已被自动关闭。

            - 如果这个问题对您来说仍然重要，您可以：
              1. 重新打开并提供补充信息
              2. 创建一个新的 issue 并更新相关背景
              3. 关联相关的 issue 或讨论

            为了更好地维护项目，我们需要定期清理不活跃的问题。

            感谢您为开源添砖加瓦！🌟
      - name: Close Inactive Issue
        if: ${{ github.event.label.name == 'stale' }}
        uses: actions-cool/issues-helper@v3
        with:
          actions: "close-issue"
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
      - name: Close Won't Fix Issue
        if: ${{ github.event.label.name == 'wontfix' }}
        uses: peter-evans/close-issue@v1
        with:
          comment: |
            🚫 After review, this issue has been closed as **it does not align with the current roadmap** Thank you for your understanding and contributions.

            ---

            🚫 经过评估，此 issue 已被关闭，因为它**不在当前项目的重点范围内**。感谢您的理解与支持。
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close Notabug Issue
        if: ${{ github.event.label.name == 'notabug' }}
        uses: peter-evans/close-issue@v1
        with:
          comment: |
            🚫 This issue has been closed as **not a bug**. If you believe this is an error, please provide more details so we can investigate further.

            ---

            🚫 此 issue 已被关闭，因为它**不是错误**。如果您认为这是误判，请提供更多细节以便我们进一步调查。
          token: ${{ secrets.GITHUB_TOKEN }}
